site_name: TL-Guard Docs
site_description: Guardrailed multilingual tutoring agent — complete workflow and developer guide
site_url: https://localhost:8001/
repo_name: Agentic-AI-as-a-Guardrailed-Multilingual-Buddy
repo_url: https://github.com/souchowdhury1997/Agentic-AI-as-a-Guardrailed-Multilingual-Buddy
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started:
      - Install & run: getting-started.md
      - Local LLM (Ollama): llm-ollama.md
  - Guides:
      - Complete workflow: workflow.md
      - Student guide: student-guide.md
      - Teacher guide: teacher-guide.md
  - Architecture:
      - Overview: architecture.md
      - Operationalizing translanguaging: operationalization.md
      - Configuration (LSM): configuration.md
  - Reference:
      - CLI: cli.md
      - HTTP API: api.md
      - Development: development.md
  - Research: research.md

extra:
  social:
    - icon: fontawesome/solid/book
      link: /
  generator: false

copyright: Copyright &copy; TL-Guard research project
